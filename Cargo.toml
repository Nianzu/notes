[package]
name = "notes-search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
data-encoding = "2.11.1"
ring = "0.17.14"
serde_json = "1.0.151"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[[bin]]
name = "notes"
path = "src/main.rs"
